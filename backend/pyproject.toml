[project]
name = "sust-eee-portal-api"
version = "1.0.0"
description = "FastAPI Backend for SUST EEE Smart Student Portal"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.4",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.1",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "firebase-admin>=6.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "structlog>=24.1.0",
    "alembic>=1.13.1",
    "sqlparse>=0.5.0",
    "pgvector>=0.4.1,<0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
ci = [
    "ruff>=0.16,<0.17",
    "mypy>=2.4,<3",
    "pip-audit>=2.10,<3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
