# Production stack.
#
# Requires a .env alongside this file. Unlike the dev compose, nothing here
# falls back to an in-repo default: a missing variable is a startup failure,
# which is the correct outcome for a production deployment. See .env.example
# for the full list.
#
# TLS: this file does NOT terminate TLS. The frontend container serves plain
# HTTP on 80, and the backend security headers only emit HSTS when
# ENVIRONMENT=production. Put this behind a TLS terminator (a cloud load
# balancer, or an nginx/Traefik sidecar) that owns 443 and forwards to 80; that
# layer must also set Strict-Transport-Security, because HSTS on a plain-HTTP
# response is ignored by browsers.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # No ports: section on purpose. The database must not be reachable from
    # outside the compose network; the dev file publishes 5433 for convenience
    # and that must not carry over.

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Creates the (private) bucket once. Kept separate from the backend so the
  # API never needs bucket-admin rights at runtime.
  minio_init:
    # Reuse the server image's mc binary instead of a second image download.
    image: minio/minio
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$${S3_BUCKET_NAME:-sust-eee-resources} &&
      mc anonymous set none local/$${S3_BUCKET_NAME:-sust-eee-resources}
      "
    restart: "no"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    restart: "no"
    environment:
      ENVIRONMENT: production
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      ENVIRONMENT: production
    env_file:
      - .env
    depends_on:
      minio_init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      ENVIRONMENT: production
    env_file:
      - .env
    command: celery -A app.core.celery_app.celery_app worker --loglevel=warning
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      ENVIRONMENT: production
    env_file:
      - .env
    command: celery -A app.core.celery_app.celery_app beat --loglevel=warning
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    # Only 80. The previous file published 443 while nginx.conf listens on 80
    # alone, so HTTPS looked configured but was not. TLS belongs to the
    # terminator in front of this service.
    ports:
      - "80:8080"

volumes:
  pgdata_prod:
  redisdata_prod:
  miniodata_prod:
