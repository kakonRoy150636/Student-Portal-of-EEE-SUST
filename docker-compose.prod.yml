# Production stack.
#
# Requires a .env alongside this file. Unlike the dev compose, nothing here
# falls back to an in-repo default: a missing variable is a startup failure,
# which is the correct outcome for a production deployment. See .env.example
# for the full list.
#
# TLS: this file does NOT terminate TLS. The frontend container serves plain
# HTTP on 80, and the backend security headers only emit HSTS when
# ENVIRONMENT=production. Put this behind a TLS terminator (a cloud load
# balancer, or an nginx/Traefik sidecar) that owns 443 and forwards to 80; that
# layer must also set Strict-Transport-Security, because HSTS on a plain-HTTP
# response is ignored by browsers.

x-production-environment: &production-environment
  ENVIRONMENT: production
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sust-eee-resources}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:?S3_PUBLIC_ENDPOINT_URL is required}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-["172.16.0.0/12"]}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}

services:
  postgres:
    image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # No ports: section on purpose. The database must not be reachable from
    # outside the compose network; the dev file publishes 5433 for convenience
    # and that must not carry over.

  redis:
    image: redis@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sust-eee-resources}
    volumes:
      - miniodata_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Creates the (private) bucket once. Kept separate from the backend so the
  # API never needs bucket-admin rights at runtime.
  minio_init:
    # Reuse the server image's mc binary instead of a second image download.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$${S3_BUCKET_NAME:-sust-eee-resources} &&
      mc anonymous set none local/$${S3_BUCKET_NAME:-sust-eee-resources} &&
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::$${S3_BUCKET_NAME:-sust-eee-resources}/*\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$${S3_BUCKET_NAME:-sust-eee-resources}\"]}]}' > /tmp/app-policy.json &&
      (mc admin policy info local app-policy >/dev/null 2>&1 || mc admin policy create local app-policy /tmp/app-policy.json) &&
      (mc admin user info local $$S3_ACCESS_KEY >/dev/null 2>&1 || mc admin user add local $$S3_ACCESS_KEY $$S3_SECRET_KEY) &&
      mc admin policy attach local app-policy --user $$S3_ACCESS_KEY
      "
    restart: "no"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    restart: "no"
    environment: *production-environment
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment: *production-environment
    env_file:
      - .env
    depends_on:
      minio_init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment: *production-environment
    env_file:
      - .env
    command: celery -A app.core.celery_app.celery_app worker --loglevel=warning
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment: *production-environment
    env_file:
      - .env
    command: celery -A app.core.celery_app.celery_app beat --loglevel=warning --scheduler app.core.beat:SingletonScheduler --max-interval=5
    deploy:
      replicas: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
        VITE_S3_PUBLIC_ENDPOINT_URL: ${VITE_S3_PUBLIC_ENDPOINT_URL:?VITE_S3_PUBLIC_ENDPOINT_URL is required}
      dockerfile: Dockerfile
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:?S3_PUBLIC_ENDPOINT_URL is required}
      CSP_UPGRADE_INSECURE: ${CSP_UPGRADE_INSECURE:-}
    # Only 80. The previous file published 443 while nginx.conf listens on 80
    # alone, so HTTPS looked configured but was not. TLS belongs to the
    # terminator in front of this service.
    ports:
      - "80:8080"

volumes:
  pgdata_prod:
  redisdata_prod:
  miniodata_prod:
