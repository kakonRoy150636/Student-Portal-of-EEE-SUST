services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sust_eee_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sust_eee_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sust_eee_redis
    restart: always
    ports:
      - "6380:6379"

  minio:
    image: minio/minio
    container_name: sust_eee_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the resources bucket on first boot. Without this every upload
  # presign fails against a fresh volume because the bucket does not exist.
  minio-init:
    # The server image already includes mc (also used by its healthcheck).
    image: minio/minio
    container_name: sust_eee_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$${S3_BUCKET_NAME:-sust-eee-resources} &&
      mc anonymous set none local/$${S3_BUCKET_NAME:-sust-eee-resources}
      "
    # The bucket is intentionally private. It used to be set to anonymous
    # download, which combined with file_key leaking from /resources/search
    # meant anyone authenticated (or who guessed a key) could pull any upload.
    # Objects are now reached only through short-lived presigned URLs minted
    # after an authorised API call -- see services/resource_service.py.
    restart: "no"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  seed-dev:
    image: pgvector/pgvector:pg16
    profiles: ["dev-seed"]
    restart: "no"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-sust_eee_db}
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    volumes:
      - ./database/dev:/seed:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sust_eee_backend
    restart: always
    depends_on:
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    ports:
      - "8000:8000"
    # Hot reload for local development only; the image itself runs without it.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./database:/database:ro

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sust_eee_celery_worker
    restart: always
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sust_eee_celery_beat
    restart: always
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info --scheduler app.core.beat:SingletonScheduler --max-interval=5
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sust_eee_frontend
    restart: always
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
