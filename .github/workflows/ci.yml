name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint, types and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements-dev.txt
      - name: Install backend and checking tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install '.[dev,ci]'
      - name: Ruff
        run: python -m ruff check app tests alembic
      - name: Mypy
        if: ${{ !cancelled() }}
        run: python -m mypy app
      - name: Audit installed Python dependencies
        if: ${{ !cancelled() }}
        run: python -m pip_audit --local --format=json --output=pip-audit.json
      - name: Upload dependency audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: backend/pip-audit.json
          if-no-files-found: warn

  backend-tests:
    name: Backend PostgreSQL and Redis tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: portal_test
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_test -d portal_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-signing-key-never-use-in-production
      DATABASE_URL: postgresql+asyncpg://portal_test:ci-disposable-password@localhost:5432/portal_test
      TEST_DATABASE_URL: postgresql+asyncpg://portal_test:ci-disposable-password@localhost:5432/portal_test
      INTEGRATION_DATABASE_URL: postgresql://portal_test:ci-disposable-password@localhost:5432/portal_test
      MIGRATION_TEST_DATABASE_URL: postgresql://portal_test:ci-disposable-password@localhost:5432/portal_test
      REDIS_URL: redis://localhost:6379/15
      INTEGRATION_REDIS_URL: redis://localhost:6379/15
      SECURITY_TEST_REDIS_URL: redis://localhost:6379/14
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install '.[dev]'
      - name: Pytest (real services, including concurrent transactions)
        run: >-
          python -m pytest tests -ra --tb=short
          --cov=app --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov --junitxml=junit.xml
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/junit.xml
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 14

  frontend:
    name: Frontend lint, types, build and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Audit all npm dependencies (including build tools)
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Upload npm audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: frontend/npm-audit.json

  images:
    name: Build and scan ${{ matrix.component }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build locally for scanning (no registry push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          load: true
          push: false
          tags: portal-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
      - name: Trivy HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portal-${{ matrix.component }}:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: trivy-${{ matrix.component }}.json
          cache: true
      - name: Upload image scan
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.json
          if-no-files-found: warn
