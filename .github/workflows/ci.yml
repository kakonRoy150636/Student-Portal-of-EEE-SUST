name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        # ENVIRONMENT/SECRET_KEY are supplied by tests/conftest.py; the suite
        # runs on SQLite, so no services are needed. Booking tests that need
        # PostgreSQL's GiST exclusion constraint skip themselves.
        run: python -m pytest -q

      - name: Static security analysis (bandit)
        run: |
          pip install bandit
          bandit -r app -ll

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          # Informational: an upstream advisory should be visible in CI, but a
          # transitive CVE with no fix available must not block every PR.
          pip-audit || true

  frontend:
    name: Frontend typecheck, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Dependency audit
        # Fails the build on high/critical advisories in runtime dependencies.
        run: npm audit --omit=dev --audit-level=high
