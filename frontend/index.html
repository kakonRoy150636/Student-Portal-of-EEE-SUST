<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Department crest. A small opaque copy lives in /public because a
         favicon is resolved by the browser from the site root, not through
         the bundler, so it cannot be imported from src/assets. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/dept-crest-32.png" />
    <link rel="apple-touch-icon" href="/dept-crest-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <title>SUST EEE Smart Student Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400;75..100,500;75..100,600;75..100,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-[var(--bg)] font-sans text-[var(--text)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
