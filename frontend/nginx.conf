server {
    # 8080 rather than 80: the container runs as the unprivileged nginx user
    # and cannot bind a port below 1024. Compose maps the host port onto this.
    listen 8080;
    server_name localhost;

    # --- Security headers -------------------------------------------------
    # The API sets its own headers (backend/app/main.py), but static assets and
    # the SPA shell are served straight from this nginx, so the edge needs its
    # own copy or index.html ships unprotected.

    # CSP: the SPA is bundled and self-hosted, so nothing needs an external
    # origin. 'unsafe-inline' is required for styles because the build inlines
    # critical CSS; scripts do NOT get it. connect-src allows the same-origin
    # API and the MinIO endpoint used for avatar images.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:9000; font-src 'self' data:; connect-src 'self' http://localhost:9000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is deliberately omitted here: this container terminates plain HTTP in
    # development, and a browser that caches HSTS for localhost becomes very
    # annoying to debug. The TLS terminator in front of this should set it --
    # docker-compose.prod.yml documents that requirement.

    # Same-origin API: the bundle calls relative paths (see src/config/env.ts),
    # so the browser never needs to know where the API container listens.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
