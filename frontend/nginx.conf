server {
    listen 80;
    server_name localhost;

    # ── security headers ───────────────────────────────────────────────────
    # These were entirely absent: the app was framable, MIME-sniffable and had
    # no CSP. `always` matters -- without it nginx omits the headers on error
    # responses, which is exactly where a reflected message could be rendered.
    #
    # CSP notes: Vite emits a hashed, self-hosted bundle, so script-src can
    # stay at 'self' with no inline allowance. Styles need 'unsafe-inline'
    # because Tailwind injects a style element at runtime; fonts come from
    # Google Fonts (see index.html), images may be data: URIs (inlined
    # sprites) and blobs (the registration avatar preview uses
    # URL.createObjectURL).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http://localhost:9000; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is added by the TLS terminator in a real deployment (see
    # docker-compose.prod.yml); sending it from a plain-HTTP container would
    # pin browsers to https on hosts that never served https.

    # Same-origin API: the bundle calls relative paths (see src/config/env.ts),
    # so the browser never needs to know where the API container listens.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Deep links: any app route falls back to the SPA shell.
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable; the HTML shell must never be
    # cached or a deploy would keep serving the previous bundle.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
