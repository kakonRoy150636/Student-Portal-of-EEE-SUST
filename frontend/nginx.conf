server {
    # 8080 rather than 80: the container runs as the unprivileged nginx user
    # and cannot bind a port below 1024. Compose maps the host port onto this.
    listen 8080;
    server_name localhost;

    # --- Security headers -------------------------------------------------
    # The API sets its own headers (backend/app/main.py), but static assets and
    # the SPA shell are served straight from this nginx, so the edge needs its
    # own copy or index.html ships unprotected.

    # CSP. Two external origins are allowed, both deliberately narrow:
    #   - fonts.googleapis.com / fonts.gstatic.com serve the two webfonts
    #     linked in index.html. style-src needs the former, font-src the latter.
    #   - localhost:9000 is MinIO, used for avatar images.
    # 'unsafe-inline' is required for style-src because the build inlines
    # critical CSS; script-src does NOT get it, so injected script is still
    # blocked. Tighten the MinIO origin alongside S3_PUBLIC_ENDPOINT_URL when
    # deploying somewhere other than localhost.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:9000; connect-src 'self' http://localhost:9000 https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://fcm.googleapis.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is deliberately omitted here: this container terminates plain HTTP in
    # development, and a browser that caches HSTS for localhost becomes very
    # annoying to debug. The TLS terminator in front of this should set it --
    # docker-compose.prod.yml documents that requirement.

    # Same-origin API: the bundle calls relative paths (see src/config/env.ts),
    # so the browser never needs to know where the API container listens.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location = /firebase-messaging-sw.js {
        root /usr/share/nginx/html;
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
